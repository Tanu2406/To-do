services:
  redis:
    image: redis:7-alpine
    container_name: mern-todo-redis
    command: >
      redis-server
      --appendonly yes
      ${REDIS_PASSWORD:+--requirepass "${REDIS_PASSWORD}"}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
