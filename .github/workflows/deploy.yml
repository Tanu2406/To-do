name: CI and publish container images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Lint, build, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: client

      - name: Lint frontend
        run: npm run lint
        working-directory: client

      - name: Build frontend
        run: npm run build
        working-directory: client

      - name: Test frontend
        run: npm test
        working-directory: client

      - name: Install backend dependencies
        run: npm ci
        working-directory: server

      - name: Type-check backend
        run: npm run typecheck
        working-directory: server

      - name: Test backend
        run: npm test
        working-directory: server

  publish:
    name: Build and push backend and frontend images
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-todo-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-todo-api:sha-${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'http://localhost:8080/api' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-todo-client:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mern-todo-client:sha-${{ github.sha }}
