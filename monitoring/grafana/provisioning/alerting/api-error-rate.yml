apiVersion: 1

groups:
  - orgId: 1
    name: todo-api-errors
    folder: Todo API
    interval: 1m
    rules:
      - uid: high-api-error-rate
        title: High API 5xx error rate
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 100 * sum(rate(http_requests_total{status_code=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 0.001)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              range: false
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 5
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    type: last
                    params: []
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: B
              type: threshold
        for: 5m
        noDataState: OK
        execErrState: Alerting
        annotations:
          summary: API 5xx error rate is above 5%.
          description: The rolling 5-minute server error rate has exceeded 5% for 5 minutes.
        labels:
          severity: warning
